name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The game polls version.json to offer a one-click update when a new
      # deploy lands. Only deployed builds have one; local checkouts don't.
      #
      # The same short SHA names the service worker's shell cache, which both
      # retires the previous deploy's copy and — because it changes sw.js
      # itself — is what makes the browser notice there is a new worker at all.
      - name: Stamp the build
        run: |
          printf '{"version":"%s","built":"%s"}\n' \
            "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" sw.js
          grep -q "const BUILD = '${GITHUB_SHA::7}'" sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
